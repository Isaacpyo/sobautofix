name: Production migrations

# Manual only. Applies supabase/migrations to the production project, following
# docs/database-migration-policy.md: list, dry run, then push, then list again.
# "dry-run" (the default) changes nothing and may run from any branch. "apply"
# needs confirm=APPLY and runs only from main. Uses the repository secret
# SOB_SUPABASE_ACCESS_TOKEN; the CLI connects through a temporary login role, so
# no database password is needed. The project ref is written where
# `supabase link` would record it: link also reads the project's API keys,
# which this job does not need, so the token does not need that permission.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run lists pending migrations; apply pushes them"
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: "Type APPLY to push (apply mode only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SOB_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nmebkkelpvhxxycrbbos
    steps:
      - name: Check inputs and secret
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Repository secret SOB_SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APPLY" ]; then echo "::error::apply mode needs confirm=APPLY"; exit 1; fi
          if [ "$MODE" = "apply" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::apply runs only from main"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Point the CLI at the production project
        # Records the project ref and the IPv4 session pooler (GitHub runners
        # have no IPv6), as `supabase link` would. Prints no connection details.
        run: |
          mkdir -p supabase/.temp
          printf '%s' "$PROJECT_REF" > supabase/.temp/project-ref
          status=$(curl -sS -o pooler.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler")
          if [ "$status" != "200" ]; then echo "::error::Pooler lookup failed ($status): $(jq -r '.message // empty' pooler.json 2>/dev/null)"; rm -f pooler.json; exit 1; fi
          jq -r '[.[] | select(.database_type == "PRIMARY")][0].connection_string // empty' pooler.json > supabase/.temp/pooler-url
          rm -f pooler.json
          if [ ! -s supabase/.temp/pooler-url ]; then echo "::error::No primary pooler connection string returned"; exit 1; fi
      - name: Migration history (before)
        run: supabase migration list --linked
      - name: Dry run
        run: supabase db push --linked --dry-run
      - name: Apply
        if: inputs.mode == 'apply' && github.ref == 'refs/heads/main'
        run: supabase db push --linked
      - name: Migration history (after)
        if: inputs.mode == 'apply'
        run: supabase migration list --linked
      - name: Verify exchange tables exist
        if: inputs.mode == 'apply'
        run: |
          supabase inspect db table-stats --linked > table-stats.txt
          missing=0
          for table in exchange_settings exchange_private_settings vehicle_internal_records vehicle_costs vehicle_prep_items seller_submissions seller_submission_photos vehicle_inspections vehicle_documents vehicle_sales diary_appointments seller_offers; do
            if grep -qw "$table" table-stats.txt; then echo "present: $table"; else echo "::error::missing: $table"; missing=1; fi
          done
          rm -f table-stats.txt
          exit $missing
