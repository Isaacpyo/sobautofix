name: Preview deploy

# Vercel's Hobby plan only builds Git pushes authored by the account owner, so
# Vercel's own previews of agent-authored branches fail (vercel.json switches
# those off for claude/* branches). This job builds the same preview with the
# Vercel CLI under the owner's token instead and links it from the pull
# request ("View deployment"). Skipped when the VERCEL_TOKEN secret is not set,
# for draft PRs, and for PRs from forks (which receive no secrets).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: team_MdD9g9FtvwMlFrwWB2RWp3P3
      VERCEL_PROJECT_ID: prj_Ph2vlGcMDBUYFcWqDzM5PnDZBUI5
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI: vercel@64.1.0
    steps:
      - name: Check for the Vercel token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Repository secret VERCEL_TOKEN is not set, so no preview was built."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.ok == 'true'
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Pull the Preview environment settings
        if: steps.token.outputs.ok == 'true'
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          # The sitemap refuses a localhost site URL in a production build.
          grep -q '^NEXT_PUBLIC_SITE_URL=' .vercel/.env.preview.local || echo 'NEXT_PUBLIC_SITE_URL="https://sobautofix.com"' >> .vercel/.env.preview.local
      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: npx --yes "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
